<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Together</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f0f4ff;
}
header {
  background: #3949ab;
  color: white;
  text-align: center;
  padding: 25px;
}
.container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  padding: 20px;
}
.card {
  background: white;
  padding: 25px 10px;
  text-align: center;
  border-radius: 12px;
  font-size: 18px;
  box-shadow: 0 3px 8px #ccc;
}
</style>
</head>

<body>
<header>
<h1>📚 Study Together</h1>
<p>आपकी सफलता, हमारा लक्ष्य</p>
</header>

<div class="container">
<div class="card">📖 GK & GS</div>
<div class="card">🏛️ History</div>
<div class="card">🌍 Geography</div>
<div class="card">📜 Polity</div>
<div class="card">💰 Economics</div>
<div class="card">🔬 General Science</div>
<div class="card">📰 Current Affairs</div>
<div class="card">📝 MCQ Practice</div>
<div class="card">🎯 Mock Test</div>
<div class="card">📚 PDF Notes</div>
</div><div class="card">
<h2>📝 MCQ Practice</h2>
<p id="question">भारत की राजधानी क्या है?</p>

<button onclick="checkAnswer(this,'Delhi')">दिल्ली</button>
<button onclick="checkAnswer(this,'Mumbai')">मुंबई</button>
<button onclick="checkAnswer(this,'Patna')">पटना</button>
<button onclick="checkAnswer(this,'Jaipur')">जयपुर</button>

<p id="result"></p>
</div>

<script>
function checkAnswer(btn, answer) {
let result = document.getElementById("result");
if(answer === "Delhi") {
result.innerHTML = "✅ बिल्कुल सही जवाब!";
} else {
result.innerHTML = "❌ गलत जवाब! सही उत्तर दिल्ली है।";
}
}
  </script>
</body>
</html>
